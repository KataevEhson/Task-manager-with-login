{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task manager</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="card">
        <h2>{{ task.title }}</h2>
        <p>{{ task.caption }}</p>
    </div>
    <div class="task-actions">
    <a class="button" href="/update_task/{{ task.pk }}">Update</a>
    <form class="delete-action" method="post" action="/delete_task/{{ task.pk }}/">
        {% csrf_token %}
        <button type="submit">Delete</button>
    </form>
    <a class="button" href="/show_task/">Назад</a>
    </div>
</body>
</html>
